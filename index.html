<html lang="id"><head><meta charset="utf-8"><title>Admin OSIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14264f"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--navy:#0e1b3d;--blue:#2a4a95;--bd:#e1e7f3;--mu:#5b6788;--tx:#1b2438;--bg:#f2f5fb;--red:#c0392b;--grn:#1e8e5a;--amb:#c77d0a;--sb:262px}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit}
.sb{position:fixed;inset:0 auto 0 0;width:var(--sb);background:linear-gradient(170deg,#0e1b3d,#1d3670 70%,#2a4a95);color:#fff;z-index:30;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px;border-bottom:1px solid #ffffff22;margin-bottom:6px}.brand img{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid #8fb3ff}.brand b{display:block;line-height:1.2}.brand small{opacity:.65;font-size:12px}
.gh{font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.55;margin:16px 8px 6px}
.ni{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#fff;opacity:.82;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;margin-bottom:2px}.ni:hover{background:#ffffff14;opacity:1}.ni.on{background:#fff;color:var(--navy);opacity:1;font-weight:700}.ni i{font-style:normal;width:22px;text-align:center}
.ni em{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-style:normal;font-size:12px;padding:0 8px;font-weight:700}
.out{margin-top:auto;padding-top:14px}.out .btn{width:100%}
.mn{margin-left:var(--sb);min-height:100vh}
.tb{position:sticky;top:0;z-index:20;background:#f2f5fbee;backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 22px 12px}.tb h2{margin:0;font-size:20px;flex:1}.hb{display:none;background:#fff;border:1px solid var(--bd);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
main{max-width:1000px;margin:auto;padding:20px 22px calc(40px + env(safe-area-inset-bottom,0px))}
.sc{display:none}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}.btn:hover{filter:brightness(1.1)}.btn.s{padding:6px 12px;font-size:13px}.btn.r{background:#fdeceb;color:var(--red)}.btn.g{background:#e8effc;color:var(--navy)}.btn:disabled{opacity:.6}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #14264f0d}
.card h3{margin:6px 0 4px;font-size:16px}.card p{margin:4px 0;color:var(--mu);font-size:14px}
.tag{display:inline-block;background:#e8effc;color:var(--navy);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin:0 4px 4px 0}.tag.ok{background:#e0f5ea;color:var(--grn)}.tag.wr{background:#fdf1dc;color:var(--amb)}.tag.bl{background:#e1ebff;color:var(--blue)}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx)}input:focus,select:focus,textarea:focus{outline:2px solid #8fb3ff;border-color:#8fb3ff}textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hero{background:linear-gradient(120deg,#0e1b3d,#2a4a95);color:#fff;border-radius:18px;padding:22px;margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.hero h3{margin:0 0 4px;font-size:19px}.hero p{margin:0;opacity:.8;color:#fff}.hero div{flex:1;min-width:200px}.hero .btn{background:#fff;color:var(--navy)}
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.sum .card{text-align:left;margin:0;cursor:pointer;border:0;width:100%;transition:transform .15s}.sum .card:hover{transform:translateY(-2px)}.sum i{font-style:normal;font-size:22px}.sum b{display:block;font-size:30px;color:var(--blue);line-height:1.2}.sum span{color:var(--mu);font-size:13px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.pc{padding:0;margin:0;overflow:hidden;display:flex;flex-direction:column}
.cv{aspect-ratio:16/10;background:linear-gradient(135deg,#dfe8fb,#c3d3f5);display:grid;place-items:center;font-size:38px;overflow:hidden}.cv img{width:100%;height:100%;object-fit:cover}
.cv.av{aspect-ratio:auto;padding:18px 0 0;background:none}.cv.av img,.cv.av span{width:110px;height:110px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#dfe8fb,#c3d3f5);display:grid;place-items:center;border:3px solid #e8effc}
.pb{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1}.pc.m .pb{text-align:center}.pb h3{margin:0 0 6px}.pb p{flex:1}.pb .row{margin-top:8px}
.em{text-align:center;padding:40px 16px;color:var(--mu)}.em i{display:block;font-style:normal;font-size:44px}
.ip{display:flex;gap:14px;align-items:center;margin-top:4px}.pv{width:96px;height:72px;border-radius:12px;background:#e8effc;display:grid;place-items:center;font-size:28px;overflow:hidden;flex:none}.pv img{width:100%;height:100%;object-fit:cover}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 20% 15%,#2a4a95,transparent 45%),linear-gradient(160deg,#0e1b3d,#1d3670)}.lg{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:26px;box-shadow:0 20px 50px #0006}.lg img{width:76px;height:76px;border-radius:50%;display:block;margin:0 auto 10px;border:3px solid #e8effc}
.md{position:fixed;inset:0;background:#0009;z-index:50;display:grid;place-items:center;padding:12px;overflow:auto}.mb{background:#fff;border-radius:18px;padding:20px;max-width:560px;width:100%;max-height:92vh;overflow:auto}.mb h3{margin:0 0 4px}
#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:grid;gap:8px}.ti{background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px}.ti.e{background:var(--red)}
.er{color:var(--red);font-size:13px;min-height:18px}.nt{background:#e8effc;border:1px solid #8fb3ff;border-radius:12px;padding:12px 14px;font-size:14px}
@media(max-width:900px){.sb{transform:translateX(-100%)}.nv .sb{transform:none;box-shadow:8px 0 30px #0006}.nv .sc{display:block;position:fixed;inset:0;background:#0006;z-index:25}.mn{margin-left:0}.hb{display:block}.tb,main{padding-left:14px;padding-right:14px}}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}.ov{overflow-x:auto}
.cr{position:fixed;inset:0;background:#000b;z-index:55;display:grid;place-items:center;padding:12px;overflow:auto}.crb{background:#fff;border-radius:18px;padding:16px}.crs{position:relative;margin:10px auto;touch-action:none;user-select:none;-webkit-user-select:none;background:#111;line-height:0}.crs>img{display:block;width:100%;height:100%;pointer-events:none}.crx{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px #0008;cursor:move}.crx i{position:absolute;width:24px;height:24px;background:#fff;border:3px solid var(--blue);border-radius:50%}
.crx i[data-h=nw]{left:-13px;top:-13px;cursor:nwse-resize}.crx i[data-h=ne]{right:-13px;top:-13px;cursor:nesw-resize}.crx i[data-h=sw]{left:-13px;bottom:-13px;cursor:nesw-resize}.crx i[data-h=se]{right:-13px;bottom:-13px;cursor:nwse-resize}.crx i[data-h=n]{left:calc(50% - 12px);top:-13px;cursor:ns-resize}.crx i[data-h=s]{left:calc(50% - 12px);bottom:-13px;cursor:ns-resize}.crx i[data-h=w]{top:calc(50% - 12px);left:-13px;cursor:ew-resize}.crx i[data-h=e]{top:calc(50% - 12px);right:-13px;cursor:ew-resize}.lk .crx i.e1{display:none}.btn.g.on{background:var(--blue);color:#fff}

const todayS=()=>new Date().toLocaleDateString('sv-SE'),isOpen=c=>c.reg==='Dibuka'&&(!c.deadline||c.deadline>=todayS());

function exportCsv(){const c=S.competitions.find(x=>x.id===cView);if(!c)return;const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[['No','Nama','Kelas','WhatsApp','Tim','Anggota','Waktu daftar'],...regList().map((r,i)=>[i+1,r.nama,r.kelas,r.wa||'',r.tim||'',(r.anggota||'').replace(/\n/g,'; '),r.at])];

function regView(){const c=S.competitions.find(x=>x.id===cView);if(!c){cView=null;return lombaView()}const all=S.registrations.filter(x=>x.comp===cView).length,R=regList(),o=isOpen(c);
return`<div class="row" style="margin:0 0 12px"><button class="btn s g" data-a="cback">← Daftar lomba</button></div><div class="card"><h3>${esc(c.name)}</h3><div><span class="tag bl">${esc(c.type)}</span><span class="tag">${esc(c.mode)}</span><span class="tag ${o?'ok':'wr'}">Pendaftaran ${o?'Dibuka':'Ditutup'}</span></div><div class="row"><button class="btn s" data-a="tgl" data-id="${esc(c.id)}">${c.reg==='Dibuka'?'Tutup':'Buka'} pendaftaran</button><button class="btn s g" data-a="csv">⬇ Ekspor CSV</button></div></div><div class="card"><label style="margin-top:0">Filter kelas</label><select id="rkf"><option value="">Semua kelas (${all})</option>${kOpts(rk)}</select></div>`
+(R.length?`<div class="card ov"><table class="tbl"><thead><tr><th>#</th><th>Nama / Tim</th><th>Kelas</th><th>WhatsApp</th><th>Anggota</th><th>Daftar</th><th></th></tr></thead><tbody>${R.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.tim||r.nama)}</b>${r.tim?`<br><small>Ketua: ${esc(r.nama)}</small>`:''}</td><td>${esc(r.kelas)}</td><td>${esc(r.wa||'-')}</td><td style="white-space:pre-line">${esc(r.anggota||'')}</td><td>${fd(r.at)}</td><td><button class="btn s r" data-a="rdel" data-id="${esc(r.id)}">Hapus</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="em"><i>📭</i>Belum ada pendaftar.</div>')}
function lombaView(){const a=S.activities.find(x=>x.id===aView);if(!a){aView=null;return''}if(cView)return regView();const L=S.competitions.filter(x=>x.act===aView);
return`<div class="row" style="margin:0 0 12px"><button class="btn s g" data-a="back">← Kembali ke Kegiatan</button></div><div class="hero"><div><h3>${esc(a.name)}</h3><p>${a.date?fd(a.date)+' · ':''}${L.length} cabang lomba · ${a.pub==='Draft'?'Draft (belum tampil di publik)':'Terbit'}</p></div><button class="btn" data-a="ed" data-c="competitions">+ Tambah Lomba</button></div>`+(L.length?`<div class="gr">${L.map(lcard).join('')}</div>`:'<div class="em"><i>🏆</i>Belum ada cabang lomba. Klik "+ Tambah Lomba" untuk menambahkan (mis. Futsal, Voli, Tarik Tambang, Menyanyi).</div>')}
function form(c,id){const r=c==='settings'?S.settings:(S[c].find(x=>x.id===id)||{});modal(`<h3>${id?'Edit':'Tambah'} ${esc(TT[c])}</h3><form id="ef" data-c="${c}" data-id="${esc(id||'')}">${F[c].map(f=>f[2]==='img'?`<label>${f[1]} <small style="font-weight:400;color:var(--mu)">(opsional, otomatis dikecilkan)</small></label><div class="ip"><div class="pv" id="pv">${r.img?`<img src="${esc(r.img)}" alt="">`:'📷'}</div><input type="hidden" name="img" id="imv" value="${esc(r.img)}"><div><label class="btn s g" style="display:inline-block;margin:0;cursor:pointer">Pilih foto<input type="file" accept="image/*" hidden data-img></label> <button type="button" class="btn s g" data-a="recrop">Pangkas</button> <button type="button" class="btn s r" data-a="rmimg">Hapus</button></div></div>`:`<label>${f[1]}</label>${f[2]==='ta'?`<textarea name="${f[0]}">${esc(r[f[0]])}</textarea>`:Array.isArray(f[2])?`<select name="${f[0]}">${f[2].map(o=>`<option${o===r[f[0]]?' selected':''}>${o}</option>`).join('')}</select>`:`<input name="${f[0]}" type="${f[2]||'text'}" value="${esc(r[f[0]])}">`}`).join('')}<div class="row"><button class="btn">Simpan</button><button type="button" class="btn g" data-a="mx2">Batal</button></div></form>`)}
const setImg=u=>{$('#imv').value=u;$('#pv').innerHTML=`<img src="${u}" alt="">`};
function cropImage(src){return new Promise(res=>{const go=url=>{const im=new Image();im.onload=()=>{
const mw=Math.min(innerWidth-56,640),mh=Math.max(180,innerHeight-260),k=Math.min(mw/im.naturalWidth,mh/im.naturalHeight,1),W=Math.round(im.naturalWidth*k),H=Math.round(im.naturalHeight*k),MIN=30,cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
let ratio=0,B={x:W*.05,y:H*.05,w:W*.9,h:H*.9},st=null;
const d=document.createElement('div');d.className='cr';
d.innerHTML=`<div class="crb" style="width:${W+32}px"><b>Pangkas foto</b><div style="color:var(--mu);font-size:13px;line-height:1.4">Geser kotak untuk memindahkan. Tarik titik putih untuk mengubah ukuran sesuka Anda.</div><div class="crs" style="width:${W}px;height:${H}px"><img src="${url}" alt=""><div class="crx">${['nw','n','ne','e','se','s','sw','w'].map(h=>`<i data-h="${h}"${h.length>1?'':' class="e1"'}></i>`).join('')}</div></div><div class="row" style="margin-top:0">${[['Bebas',0],['16:10',1.6],['4:3',4/3],['1:1',1],['3:4',.75]].map((r,i)=>`<button type="button" class="btn s g${i?'':' on'}" data-r="${r[1]}">${r[0]}</button>`).join('')}</div><div class="row"><button type="button" class="btn" id="cok">Pakai foto ini</button><button type="button" class="btn g" id="cno">Batal</button></div></div>`;
const stg=d.querySelector('.crs'),rx=d.querySelector('.crx'),paint=()=>{rx.style.left=B.x+'px';rx.style.top=B.y+'px';rx.style.width=B.w+'px';rx.style.height=B.h+'px'};
const drag=(h,dx,dy,o)=>{if(h==='m')return{x:cl(o.x+dx,0,W-o.w),y:cl(o.y+dy,0,H-o.h),w:o.w,h:o.h};
let x1=o.x,y1=o.y,x2=o.x+o.w,y2=o.y+o.h;
if(h.includes('w'))x1=cl(o.x+dx,0,x2-MIN);if(h.includes('e'))x2=cl(x2+dx,x1+MIN,W);if(h.includes('n'))y1=cl(o.y+dy,0,y2-MIN);if(h.includes('s'))y2=cl(y2+dy,y1+MIN,H);
if(ratio&&h.length===2){let w=x2-x1,hh=y2-y1;if(w/hh>ratio)w=hh*ratio;else hh=w/ratio;if(h.includes('w'))x1=x2-w;else x2=x1+w;if(h.includes('n'))y1=y2-hh;else y2=y1+hh}
return{x:x1,y:y1,w:x2-x1,h:y2-y1}};
d.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ratio=+b.dataset.r;stg.classList.toggle('lk',!!ratio);d.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b));if(ratio){let w=W*.9,h=w/ratio;if(h>H*.9){h=H*.9;w=h*ratio}B={x:(W-w)/2,y:(H-h)/2,w,h}}paint()});
stg.onpointerdown=e=>{const t=e.target.closest('[data-h]'),h=t?t.dataset.h:(e.target.closest('.crx')?'m':null);if(!h)return;e.preventDefault();stg.setPointerCapture(e.pointerId);st={h,x:e.clientX,y:e.clientY,o:{...B}}};
stg.onpointermove=e=>{if(!st)return;B=drag(st.h,e.clientX-st.x,e.clientY-st.y,st.o);paint()};stg.onpointerup=stg.onpointercancel=()=>{st=null};
d.querySelector('#cno').onclick=()=>{d.remove();res(null)};
d.querySelector('#cok').onclick=()=>{const s=im.naturalWidth/W,sw=Math.round(B.w*s),sh=Math.round(B.h*s),m=Math.min(1,900/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*m));c.height=Math.max(1,Math.round(sh*m));c.getContext('2d').drawImage(im,B.x*s,B.y*s,B.w*s,B.h*s,0,0,c.width,c.height);d.remove();res(c.toDataURL('image/jpeg',.8))};
document.body.append(d);paint()};im.onerror=()=>res(null);im.src=url};
if(typeof src==='string')go(src);else{const r=new FileReader();r.onload=()=>go(r.result);r.onerror=()=>res(null);r.readAsDataURL(src)}})}
function shrink(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.75))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
document.addEventListener('change',async e=>{if(!e.target.matches('[data-img]')||!e.target.files[0])return;const file=e.target.files[0];e.target.value='';try{const u=await cropImage(file);if(!u)return;if(u.length>900000)return toast('Foto terlalu besar, pilih foto lain.',1);setImg(u)}catch{toast('Foto tidak dapat dibaca.',1)}});

if(!Object.keys(S.settings).length){await fs.collection('settings').doc('main').set(D.settings);n++}toast(n?'Data awal dimuat ('+n+' data).':'Database sudah terisi.');t.disabled=false}
if(a==='asave'){await fs.collection('aspirations').doc(id).update({status:$('#st-'+id).value});toast('Aspirasi diperbarui.')}}catch(x){toast('Aksi gagal: '+(x.message||''),1)}});
document.addEventListener('change',e=>{if(e.target.id==='rkf'){rk=e.target.value;e.target.blur();draw()}});
document.addEventListener('submit',async e=>{if(e.target.id!=='ef')return;e.preventDefault();const f=e.target,c=f.dataset.c,id=f.dataset.id,d=Object.fromEntries(new FormData(f));
if(c!=='settings')for(const x of F[c])if(!String(d[x[0]]||'').trim()&&!['desc','img','rule','sched','deadline'].includes(x[0]))return toast('Semua kolom wajib diisi.',1);

try{await fs.collection(c).doc(c==='settings'?'main':id||Date.now().toString(36)).set(d);$('#md').innerHTML='';toast('Data berhasil disimpan.')}catch(x){toast(x.code==='permission-denied'?`Ditolak oleh aturan Firestore: perbarui Rules untuk koleksi "${c}".`:'Gagal menyimpan: '+(x.message||''),1)}});
if(ok){firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore();au=firebase.auth();au.onAuthStateChanged(u=>{user=u;if(u){listen();draw()}else{subs.forEach(x=>x());subs=[];login()}})}else login();
